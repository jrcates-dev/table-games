<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- viewport-fit=cover runs the room edge to edge on notched phones; the
         chrome keeps clear of the notch with env(safe-area-inset-*). -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#040406" />
    <meta
      name="description"
      content="Arena — play-money Las Vegas table games. Blackjack, craps, baccarat, roulette and Ultimate Texas Hold'em dealt by Aria's house rules, with a strategy coach at every table and every bet priced."
    />
    <!-- Installed from the home screen it opens full screen, like an app. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Arena" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Arena · Las Vegas Table Games</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
