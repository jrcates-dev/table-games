<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- viewport-fit=cover runs the room edge to edge on notched phones; the
         chrome keeps clear of the notch with env(safe-area-inset-*). -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#040406" />
    <meta
      name="description"
      content="Arena — play-money Las Vegas table games. Blackjack, craps, baccarat, roulette and Ultimate Texas Hold'em dealt by Aria's house rules, with a strategy coach at every table and every bet priced."
    />
    <!-- Installed from the home screen it opens full screen, like an app. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Arena" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Arena · Las Vegas Table Games</title>
    <!-- The card a chat app (iMessage, WhatsApp, Discord, Slack) shows for a
         pasted link. Chat apps need absolute URLs, so these name the published
         site; og-image.jpg is a 1200×630 shot of the lobby, kept out of the
         offline cache (pwa.ts). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Arena" />
    <meta property="og:url" content="https://jrcates-dev.github.io/table-games/" />
    <meta property="og:title" content="Arena · Las Vegas Table Games" />
    <meta
      property="og:description"
      content="Play-money blackjack, craps, baccarat, roulette and Ultimate Texas Hold'em, with a strategy coach at every table and the house edge on every bet."
    />
    <meta property="og:image" content="https://jrcates-dev.github.io/table-games/og-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The Arena lobby: five casino tables under a marquee in lights" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Arena · Las Vegas Table Games" />
    <meta
      name="twitter:description"
      content="Play-money casino table games with a strategy coach at every table and the house edge on every bet."
    />
    <meta name="twitter:image" content="https://jrcates-dev.github.io/table-games/og-image.jpg" />
    <meta name="twitter:image:alt" content="The Arena lobby: five casino tables under a marquee in lights" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
